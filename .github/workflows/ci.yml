name: Build and test macOS app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test motion tracking and continuous audio DSP
        run: swift test
      - name: Package universal app and validate synthesizers
        run: ./scripts/build-app.sh --universal
      - name: Verify both architectures
        run: lipo dist/LidTone.app/Contents/MacOS/LidTone -verify_arch arm64 x86_64
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LidTone-macOS
          path: dist/LidTone-macOS.zip
